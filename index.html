<script>
/* Mesin pembaca Koreksi Lembar Jawab (v2). Murni JS, bekerja pada array gray (Uint8Array). */
(function (root) {
  const GEO = { W: 470, H: 1000, sq: 30, corners: [[35, 35], [435, 35], [35, 965], [435, 965]],
    bx: [85, 295], by: 140, dx: 34, dy: 32, rows: 25, r: 11, inner: 7 };
  const VERIFY_MIN = 0.08;
  const KS = 4, KC = 2.0;   // pengali derau & batas keyakinan   // kontras lingkaran cetak minimum agar lembar diterima (toleran foto buram)

  function toGray(rgba, w, h) {
    const g = new Uint8Array(w * h);
    for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (rgba[j] * 77 + rgba[j + 1] * 150 + rgba[j + 2] * 29) >> 8;
    return g;
  }

  function integral(g, w, h) {
    const W1 = w + 1, I = new Float64Array(W1 * (h + 1));
    for (let y = 0; y < h; y++) { let row = 0; for (let x = 0; x < w; x++) { row += g[y * w + x]; I[(y + 1) * W1 + x + 1] = I[y * W1 + x + 1] + row; } }
    return I;
  }

  // Gumpalan gelap pada satu ukuran jendela ambang adaptif.
  function blobsAt(g, w, h, I, win) {
    const half = win >> 1, W1 = w + 1, bin = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      const y0 = Math.max(0, y - half), y1 = Math.min(h, y + half + 1);
      for (let x = 0; x < w; x++) {
        const x0 = Math.max(0, x - half), x1 = Math.min(w, x + half + 1);
        const m = (I[y1 * W1 + x1] - I[y0 * W1 + x1] - I[y1 * W1 + x0] + I[y0 * W1 + x0]) / ((x1 - x0) * (y1 - y0));
        if (g[y * w + x] < m * 0.62) bin[y * w + x] = 1;
      }
    }
    const seen = new Uint8Array(w * h), st = new Int32Array(w * h), blobs = [], maxA = Math.max(20000, w * h / 40);
    for (let p0 = 0; p0 < w * h; p0++) {
      if (!bin[p0] || seen[p0]) continue;
      let sp = 0, area = 0, sx = 0, sy = 0, minx = w, maxx = 0, miny = h, maxy = 0;
      st[sp++] = p0; seen[p0] = 1;
      while (sp) {
        const p = st[--sp], x = p % w, y = (p / w) | 0;
        area++; sx += x; sy += y;
        if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
        if (x > 0 && bin[p - 1] && !seen[p - 1]) { seen[p - 1] = 1; st[sp++] = p - 1; }
        if (x < w - 1 && bin[p + 1] && !seen[p + 1]) { seen[p + 1] = 1; st[sp++] = p + 1; }
        if (y > 0 && bin[p - w] && !seen[p - w]) { seen[p - w] = 1; st[sp++] = p - w; }
        if (y < h - 1 && bin[p + w] && !seen[p + w]) { seen[p + w] = 1; st[sp++] = p + w; }
      }
      const bw = maxx - minx + 1, bh = maxy - miny + 1;
      if (area < 80 || area > maxA) continue;
      if (bw / bh > 2 || bh / bw > 2 || area / (bw * bh) < 0.5) continue;
      blobs.push({ x: sx / area, y: sy / area, s: Math.sqrt(area), area });
    }
    return blobs;
  }

  // Beberapa ukuran jendela sekaligus, agar kotak besar (foto dekat) tidak berlubang.
  function findBlobs(g, w, h) {
    const base = Math.max(41, Math.round(Math.min(w, h) / 18) | 1), I = integral(g, w, h), out = [];
    for (const win of [base, (base * 2) | 1, (base * 3.5) | 1]) {
      for (const b of blobsAt(g, w, h, I, win)) {
        const i = out.findIndex(o => Math.hypot(o.x - b.x, o.y - b.y) < 0.5 * Math.max(o.s, b.s));
        if (i < 0) out.push(b); else if (b.s > out[i].s * 1.15) out[i] = b;
      }
    }
    return out;
  }

  // Semua susunan empat gumpalan yang cocok dengan proporsi lembar (tanpa bergantung ukuran gumpalan,
  // karena foto buram mengecilkan kotak hitam). Urutan hasil: [a, b, d, e] = sudut, sudut lebar, sudut tinggi, sudut diagonal.
  function quadCandidates(c0, geo, lo, hi) {
    lo = lo || 0.66; hi = hi || 1.6;
    let c = c0;
    if (c.length > 220) c = c.slice().sort((p, q) => q.s - p.s).slice(0, 220);
    const gw = geo.corners[1][0] - geo.corners[0][0], gh = geo.corners[2][1] - geo.corners[0][1], ratio = gh / gw;
    const map = new Map();
    for (let ia = 0; ia < c.length; ia++) {
      const a = c[ia];
      for (let ib = 0; ib < c.length; ib++) {
        if (ib === ia) continue;
        const b = c[ib], ux = b.x - a.x, uy = b.y - a.y, L1 = Math.hypot(ux, uy), exp = L1 * geo.sq / gw;
        if (a.s < lo * exp || a.s > hi * exp || b.s < lo * exp || b.s > hi * exp) continue;
        for (let id = 0; id < c.length; id++) {
          if (id === ia || id === ib) continue;
          const d = c[id], vx = d.x - a.x, vy = d.y - a.y, L2 = Math.hypot(vx, vy);
          if (L2 / L1 < ratio * 0.85 || L2 / L1 > ratio * 1.15) continue;
          if (d.s < lo * exp || d.s > hi * exp) continue;
          if (ux * vy - uy * vx <= 0) continue;
          if (Math.abs(ux * vx + uy * vy) / (L1 * L2) > 0.4) continue;
          const px = b.x + d.x - a.x, py = b.y + d.y - a.y;
          let ie = -1, bestE = 1e9;
          for (let k = 0; k < c.length; k++) {
            if (k === ia || k === ib || k === id) continue;
            const e = Math.hypot(c[k].x - px, c[k].y - py);
            if (e < bestE) { bestE = e; ie = k; }
          }
          if (ie < 0 || bestE > 0.12 * L1) continue;
          const e = c[ie];
          if (e.s < lo * exp || e.s > hi * exp) continue;
          const ar = [a, b, d, e].map(o => o.area), mx = Math.max(...ar), mn = Math.min(...ar);
          if (mx / mn > 2.5) continue;
          const key = [ia, ib, id, ie].sort((p, q) => p - q).join(',');
          const cur = map.get(key);
          if (!cur || bestE < cur.err) map.set(key, { err: bestE, ids: [ia, ib, id, ie], pts: [a, b, d, e].map(o => [o.x, o.y]), meanS: (a.s + b.s + d.s + e.s) / 4 });
        }
      }
    }
    return Array.from(map.values()).sort((p, q) => p.err - q.err);
  }

  // Versi sederhana (dipakai pratinjau kamera): kembalikan lembar yang tidak saling berbagi gumpalan.
  function findSheets(c, geo) {
    let cands = quadCandidates(c, geo, 0.75, 1.4);
    const maxS = Math.max(0, ...cands.map(q => q.meanS));
    cands = cands.filter(q => q.meanS >= 0.75 * maxS);   // buang kuadran palsu dari bulatan hitam (lebih kecil dari kotak sudut)
    const used = new Set(), out = [];
    cands.forEach(q => {
      if (q.ids.some(i => used.has(i))) return;
      q.ids.forEach(i => used.add(i)); out.push(q.pts);
    });
    return out.sort((p, q) => (p[0][0] + p[3][0]) - (q[0][0] + q[3][0]));
  }

  function homography(src, dst) {
    const A = [];
    for (let i = 0; i < 4; i++) {
      const [x, y] = src[i], [u, v] = dst[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y, u]);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y, v]);
    }
    for (let i = 0; i < 8; i++) {
      let p = i; for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
      [A[i], A[p]] = [A[p], A[i]];
      for (let r = 0; r < 8; r++) { if (r === i) continue; const f = A[r][i] / A[i][i]; for (let k = i; k < 9; k++) A[r][k] -= f * A[i][k]; }
    }
    const h = A.map((r, i) => r[8] / r[i]); h.push(1); return h;
  }

  function warp(g, w, h, H, geo) {
    const out = new Uint8Array(geo.W * geo.H);
    for (let y = 0; y < geo.H; y++) for (let x = 0; x < geo.W; x++) {
      const den = H[6] * x + H[7] * y + 1, u = (H[0] * x + H[1] * y + H[2]) / den, v = (H[3] * x + H[4] * y + H[5]) / den;
      const x0 = Math.max(0, Math.min(w - 2, Math.floor(u))), y0 = Math.max(0, Math.min(h - 2, Math.floor(v)));
      const fx = Math.max(0, Math.min(1, u - x0)), fy = Math.max(0, Math.min(1, v - y0)), i = y0 * w + x0;
      out[y * geo.W + x] = (g[i] * (1 - fx) + g[i + 1] * fx) * (1 - fy) + (g[i + w] * (1 - fx) + g[i + w + 1] * fx) * fy;
    }
    return out;
  }

  // Ambang adaptif: pensil tipis/foto buram menghasilkan "fill" lebih kecil, jadi ambang menyesuaikan sheet itu sendiri.
  function median(a) { const s = a.slice().sort((p, q) => p - q); return s[s.length >> 1]; }

  // Geser kisi per baris: kertas melengkung/lensa membuat bulatan sedikit bergeser dari kisi dasar.
  // Cincin cetak dari kelima bulatan satu baris dipakai untuk mencari pergeseran terbaik (±5 satuan).
  function rowOffsets(can, geo) {
    const R = 5, out = [];
    for (let q = 0; q < geo.rows * 2; q++) {
      const col = (q / geo.rows) | 0, cy = geo.by + (q % geo.rows) * geo.dy;
      let best = -1e9, bx = 0, by = 0;
      for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
        let sc = 0;
        for (let k = 0; k < 5; k++) {
          const cx = geo.bx[col] + k * geo.dx + dx, y0 = cy + dy;
          for (let a = 0; a < 12; a++) {
            const t = a * Math.PI / 6 + 0.2, c = Math.cos(t), s = Math.sin(t);
            let m = 255;
            for (let d = -1; d <= 1; d++) m = Math.min(m, can[Math.round(y0 + s * (geo.r + d)) * geo.W + Math.round(cx + c * (geo.r + d))]);
            sc += can[Math.round(y0 + s * (geo.r + 6)) * geo.W + Math.round(cx + c * (geo.r + 6))] - m;
          }
        }
        if (sc > best) { best = sc; bx = dx; by = dy; }
      }
      out.push([bx, by]);
    }
    // haluskan antar baris tetangga (median 3) agar satu baris janggal tidak melenceng
    return out.map((o, q) => {
      const col = (q / geo.rows) | 0, r = q % geo.rows, ids = [r - 1, r, r + 1].filter(i => i >= 0 && i < geo.rows).map(i => col * geo.rows + i);
      return [median(ids.map(i => out[i][0])), median(ids.map(i => out[i][1]))];
    });
  }

  // Baca 50 soal dari kanvas standar. Hasil per soal: 'A'-'E', '-' kosong, '*' ganda, '?' cek ulang.
  function readSheet(can, geo) {
    const n = geo.rows * 2, D = [], rr = geo.inner * geo.inner, offs = rowOffsets(can, geo);
    for (let q = 0; q < n; q++) {
      const col = (q / geo.rows) | 0, cy = geo.by + (q % geo.rows) * geo.dy + offs[q][1], row = [];
      for (let k = 0; k < 5; k++) {
        const cx = geo.bx[col] + k * geo.dx + offs[q][0]; let s = 0, c = 0; const win = [];
        for (let y = cy - 14; y <= cy + 14; y++) for (let x = cx - 24; x <= cx + 24; x++) {
          const v = can[y * geo.W + x];
          if ((x - cx) ** 2 + (y - cy) ** 2 <= rr) { s += v; c++; }
          if (((x + y) & 1) === 0) win.push(v);
        }
        win.sort((a, b) => a - b);
        const paper = win[Math.floor(win.length * 0.85)] || 255;
        row.push(Math.max(0, 1 - (s / c) / paper));
      }
      D.push(row);
    }
    // baseline per huruf (A..E): tinta huruf cetak berbeda tiap huruf, jadi dikurangi per kolom pilihan
    const baseK = [0, 1, 2, 3, 4].map(k => median(D.map(r => r[k])));
    const f0 = D.map(r => r.map((v, k) => v - baseK[k]));
    // acuan lokal: bulatan lain pada baris yang sama berada di cahaya/kertas yang sama, jadi median barisnya dikurangkan
    const f = f0.map(r => { const m = median(r); return r.map(v => v - m); });
    // derau foto: sebaran bulatan non-tertinggi tiap baris (hampir semuanya kosong)
    const rest = [];
    f.forEach(r => { const o = r.slice().sort((p, q) => q - p); rest.push(o[1], o[3], o[4]); });
    const rmed = median(rest), sigma = 1.4826 * median(rest.map(v => Math.abs(v - rmed)));
    // tingkat "kehitaman tanda" lembar ini (hanya untuk batas bawah)
    const m1s = f.map(r => Math.max(...r)), strong = m1s.filter(v => v > Math.max(0.10, 5 * sigma));
    const level = strong.length >= 2 ? median(strong) : 0.35;
    // satu ambang deteksi: di atas derau, tetapi tetap peka pada pensil tipis
    const T1 = Math.max(0.05, KS * sigma, 0.1 * level);
    const ans = [];
    f.forEach(r => {
      const idx = [0, 1, 2, 3, 4].sort((a, b) => r[b] - r[a]), m1 = r[idx[0]], m2 = r[idx[1]];
      let a;
      if (m1 < T1) a = '-';                                   // kosong
      else if (m2 < T1 || m2 < 0.5 * m1) a = m1 >= KC * T1 ? 'ABCDE'[idx[0]] : '?'; // satu tanda (bekas hapusan yang lebih samar diabaikan); terlalu samar = ragu
      else a = m1 >= 2 * T1 ? '*' : '?';                       // dua tanda sebanding: ganda, atau ragu jika terlalu samar
      ans.push(a);
    });
    return { ans, f, base: median(baseK), Tm: T1, Tb: T1, noise: sigma, level };
  }

  // Kontras lingkaran cetak (r) terhadap celah (r+6): lembar asli > ~0.05, kisi palsu ~0. 'S' = fungsi sampel(x, y) pada kanvas standar.
  function verifyWith(S, geo) {
    let ring = 0, gap = 0, n = 0;
    for (let q = 0; q < geo.rows * 2; q += 3) {
      const col = (q / geo.rows) | 0, cy = geo.by + (q % geo.rows) * geo.dy;
      for (let k = 0; k < 5; k++) {
        const cx = geo.bx[col] + k * geo.dx;
        for (let a = 0; a < 8; a++) {
          const t = a * Math.PI / 4 + 0.39, c = Math.cos(t), s = Math.sin(t);
          let m = 255; for (let d = -1; d <= 1; d++) m = Math.min(m, S(cx + c * (geo.r + d), cy + s * (geo.r + d)));
          ring += m; gap += S(cx + c * (geo.r + 6), cy + s * (geo.r + 6)); n++;
        }
      }
    }
    return (gap - ring) / gap;
  }
  function verify(can, geo) { return verifyWith((x, y) => can[Math.round(y) * geo.W + Math.round(x)], geo); }
  function verifyQuad(g, w, h, q, geo) {
    const H = homography(geo.corners, q);
    return verifyWith((x, y) => {
      const den = H[6] * x + H[7] * y + 1, u = (H[0] * x + H[1] * y + H[2]) / den, v = (H[3] * x + H[4] * y + H[5]) / den;
      const xi = Math.max(0, Math.min(w - 1, Math.round(u))), yi = Math.max(0, Math.min(h - 1, Math.round(v)));
      return g[yi * w + xi];
    }, geo);
  }

  function process(g, w, h, geo) {
    geo = geo || GEO;
    // kotak sudut adalah gumpalan terbesar: periksa kandidat dengan gumpalan paling besar lebih dulu
    const cands = quadCandidates(findBlobs(g, w, h), geo).sort((p, q) => q.meanS - p.meanS || p.err - q.err).slice(0, 90), acc = [];
    cands.forEach(c => {
      const q1 = c.pts, q2 = [c.pts[3], c.pts[2], c.pts[1], c.pts[0]];   // lembar bisa terbalik 180°
      const v1 = verifyQuad(g, w, h, q1, geo), v2 = verifyQuad(g, w, h, q2, geo);
      const q = v1 >= v2 ? q1 : q2, v = Math.max(v1, v2);
      if (v >= VERIFY_MIN) acc.push({ q, v, ids: c.ids, meanS: c.meanS });
    });
    acc.sort((p, q) => q.v - p.v);
    // buang "lembar palsu" dari bulatan hitam: skornya jauh di bawah lembar asli dan blob-nya lebih kecil dari kotak sudut
    const maxV = acc.length ? acc[0].v : 0, maxS = Math.max(0, ...acc.map(a => a.meanS));
    const kept = acc.filter(a => a.v >= 0.4 * maxV && a.meanS >= 0.75 * maxS);
    const used = new Set(), out = [];
    kept.forEach(a => {
      if (a.ids.some(i => used.has(i))) return;
      a.ids.forEach(i => used.add(i));
      const H = homography(geo.corners, a.q), can = warp(g, w, h, H, geo);
      out.push(Object.assign({ corners: a.q, verify: a.v, can }, readSheet(can, geo)));
    });
    return out.sort((p, q) => (p.corners[0][0] + p.corners[3][0]) - (q.corners[0][0] + q.corners[3][0]));
  }

  const API = { GEO, toGray, findBlobs, findSheets, homography, warp, readSheet, verify, process };
  if (typeof module !== 'undefined') module.exports = API; else root.LJK = API;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

try{const t=localStorage.getItem('koreksi-ljk-tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
$('#theme').onclick=()=>{const v=isDark()?'light':'dark';document.documentElement.dataset.theme=v;try{localStorage.setItem('koreksi-ljk-tema',v)}catch(e){}themeIcon()};themeIcon();
const sampul=on=>$('#sampul').classList.toggle('on',on);
function seen(){try{localStorage.setItem('koreksi-ljk-sampul',today())}catch(e){}sampul(false)}
try{sampul(localStorage.getItem('koreksi-ljk-sampul')!==today())}catch(e){}
$('#mulai').onclick=seen;$('#logo').onclick=()=>sampul(true);
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sampul').classList.contains('on'))seen()});

window.APP={S:()=>S,cards:()=>cards,go,busy:()=>cards.some(c=>!c.saved)||$('#cam').classList.contains('on')};
go(NAMA[location.hash.slice(1)]?location.hash.slice(1):(active()?'pindai':'pengaturan'));
})();
</script><script>
if('serviceWorker' in navigator){addEventListener('load',()=>{
 const had=!!navigator.serviceWorker.controller;let pending=false,done=false;
 const tryReload=()=>{if(!pending||done)return;if(window.APP&&window.APP.busy())return;done=true;location.reload()};
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had)return;pending=true;tryReload()});
 setInterval(tryReload,2000);
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
  const up=()=>r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)up()});setInterval(up,3600000)}).catch(()=>{})})}
</script>
</body></html>
